<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- ピクトグラム規約（東急公式サイト「電車に乗る」に倣う）: 24pxグリッド / 単色の塗りつぶし fill=currentColor / 線なしのシルエット / 表示は48px。矢印・検索などの操作記号のみ線画 -->

  <!-- 診断: 質問票にチェック -->
  <symbol id="i-diag" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6a1 1 0 0 1 1 1v1h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V3a1 1 0 0 1 1-1zm1.6 15 6.4-6.4-1.5-1.5-4.9 4.9-2.1-2.1L7 13.4z"/></symbol>
  <!-- 機種一覧: 4つの機体（グリッド） -->
  <symbol id="i-lineup" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></symbol>
  <!-- 比較: 2枚を天秤で -->
  <symbol id="i-compare" viewBox="0 0 24 24" fill="currentColor"><path d="M11 2h2v3h5l3 8h-1.5a3.5 3.5 0 0 1-7 0H11l2.6-6.5H13v13h5v2H6v-2h5V6.5h-.6L13 13h-1.5a3.5 3.5 0 0 1-7 0H3l3-8h5zM6 7.6 4.5 11.5h3zm12 0-1.5 3.9h3z"/></symbol>
  <!-- 選び方ガイド: 開いた本 -->
  <symbol id="i-guide" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4.5C5 3.5 8 3.6 11 5v15c-3-1.4-6-1.5-8-.5zM21 4.5c-2-1-5-.9-8 .5v15c3-1.4 6-1.5 8-.5z"/></symbol>
  <!-- 相談: 吹き出しに「？」 -->
  <symbol id="i-consult" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 5v-5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5v2h10V8zm0 4v2h7v-2z"/></symbol>
  <!-- 運営者・情報: 丸に i -->
  <symbol id="i-info" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 8v7h2v-7zm0-4v2h2V6z"/></symbol>
  <!-- 電話 -->
  <symbol id="i-phone" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 3h3l1.6 4-2 1.5a12 12 0 0 0 6.3 6.3L17 12.8l4 1.6v3A2.6 2.6 0 0 1 18.4 20 15.4 15.4 0 0 1 4 5.6 2.6 2.6 0 0 1 6.6 3z"/></symbol>
  <!-- 資格・認定: リボン付き証書 -->
  <symbol id="i-cert" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-5v4l-3-2-3 2v-4H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>

  <!-- ハンドヘルド: 手持ちトーチ（銃型） -->
  <symbol id="i-handheld" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h11a2 2 0 0 1 2 2v2h4l1 1.5L20 13h-4a2 2 0 0 1-2 2h-3l-1 6H7l1-6H5a2 2 0 0 1-2-2z"/></symbol>
  <!-- 据置・専用機: 筐体と窓 -->
  <symbol id="i-fixed" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-3v3h-2v-3H9v3H7v-3H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 3v6h12V6z"/></symbol>
  <!-- ライン組込: ロボットアーム -->
  <symbol id="i-robot" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20h18v2H3zM5 19v-1.5a2 2 0 0 1 2-2h1V9.7A3 3 0 0 1 9.5 4l7.8 4.3-1 1.7L9.4 6.3A1 1 0 0 0 10 8v7.5h1a2 2 0 0 1 2 2V19zm12.5-9.5 3 1.6-1.5 2.6-3-1.7z"/></symbol>
  <!-- 屋外・現場: テントと太陽 -->
  <symbol id="i-outdoor" viewBox="0 0 24 24" fill="currentColor"><path d="M18 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM1 20 9 6l4 7 2-3 8 10H1zm12.5-2h6L15.5 12.6 14 15z"/></symbol>
  <!-- 鉄・ステンレス: 板と溶接ビード -->
  <symbol id="i-steel" viewBox="0 0 24 24" fill="currentColor"><path d="M2 14 8 9h14v3l-6 5H2zM2 18h14v3H2z"/></symbol>
  <!-- アルミ・銅: 丸棒・板の断面 -->
  <symbol id="i-alcu" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></symbol>
  <!-- チタン・真空: ベルジャー -->
  <symbol id="i-vacuum" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c4.4 0 7 3.4 7 8v7H5v-7c0-4.6 2.6-8 7-8zm-1 0h2v2h-2zM3 18h18v3H3z"/></symbol>
  <!-- 厚物: 厚い板と寸法 t -->
  <symbol id="i-thick" viewBox="0 0 24 24" fill="currentColor"><path d="M2 8h13v10H2zM17 8h5v2h-1.5v6H22v2h-5v-2h1.5v-6H17z"/></symbol>
  <!-- 薄板: 薄い板 -->
  <symbol id="i-thin" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h13v2H2zM17 8h5v2h-1.5v4H22v2h-5v-2h1.5v-4H17z"/></symbol>
  <!-- 素材（一般）: 重ねた板 -->
  <symbol id="i-material" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l10 5-10 5L2 8zm-8 8.5 8 4 8-4 2 1-10 5-10-5zm0 4 8 4 8-4 2 1-10 5-10-5z"/></symbol>
  <!-- 作業環境: 工場 -->
  <symbol id="i-factory" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21V9l5 3V9l5 3V9l5 3V6h3v15zM5 15v3h3v-3zm5 0v3h3v-3zm5 0v3h3v-3z"/></symbol>
  <!-- 使う人: 溶接面をつけた人 -->
  <symbol id="i-user" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-7 19c0-4 3-7 7-7s7 3 7 7z"/></symbol>
  <!-- 予算: 円マーク -->
  <symbol id="i-yen" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-4 5 3 5H8.5v1.5H11V15H8.5v1.5H11V19h2v-2.5h2.5V15H13v-1.5h2.5V12H13l3-5h-2.2l-1.8 3.4L10.2 7z"/></symbol>
  <!-- 用途: 溶接中の火花（作業） -->
  <symbol id="i-work" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21 12.5 6.4 15 9l2.6-2.6 1.5 1.5L20.5 6.4a1.5 1.5 0 0 0-2.1-2.1L17 5.7 15 3.5 3 15v6zm3-3.5v-1.6l9-9 1.6 1.6z"/></symbol>

  <!-- 機能アイコン -->
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></symbol>
  <!-- 旧名の互換 -->
  <symbol id="i-list" viewBox="0 0 48 48"><use href="#i-lineup"/></symbol>
  <symbol id="i-contact" viewBox="0 0 48 48"><use href="#i-consult"/></symbol>
  <symbol id="i-article" viewBox="0 0 48 48"><use href="#i-guide"/></symbol>
</svg>
