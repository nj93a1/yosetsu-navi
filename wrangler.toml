name = "yosetsu-navi"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 正式なドメイン（2026-10-17 公開。Xサーバーで取得、DNS は Cloudflare の KDM アカウント）。www は Worker が正式なドメインへ 301
routes = [
  { pattern = "yosetsu-kakaku.com", custom_domain = true },
  { pattern = "www.yosetsu-kakaku.com", custom_domain = true },
]
# 仮 URL（yosetsu-navi.jolly-frost-2311.workers.dev）も残す。以前のリンクから来た人は、REDIRECT_TO_ORIGIN = "1" で正式なドメインへ 301
workers_dev = true

# src/ 配下（HTML・CSS・JS・診断用JSON）は静的アセットとして配信し、
# /api/* と /products/* だけ Worker が処理する。
[assets]
directory = "./src"
binding = "ASSETS"
# 静的ファイルも Worker を通す（正式なドメイン以外に noindex を付ける・www を転送するため）
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "yosetsu-navi"
database_id = "2bb93c16-5b60-42f1-9f51-c540801d8695"

# 相談フォームのメール送信（Cloudflare Email Routing の send_email）。
# ドメイン（溶接価格.com）を Cloudflare に追加して Email Routing を有効にし、受付用 Gmail を「宛先アドレス」として確認したら、下のコメントを外す。
# 送信元はそのドメインのアドレス（日本語ドメインは xn-- の形）。宛先は確認済みのアドレスだけ。
# [[send_email]]
# name = "MAIL"
# destination_address = "受付用のGmailアドレス"
#
# （[vars] は下にある。CONTACT_TO などはそこに足す）
# CONTACT_TO = "受付用のGmailアドレス"
# CONTACT_FROM = "form@（ドメインの xn-- 形）"
# CONTACT_FROM_NAME = "相談フォーム"

[vars]
# 仮 URL（workers.dev）に来た人を正式なドメインへ 301 で転送する
REDIRECT_TO_ORIGIN = "1"
